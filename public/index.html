<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#495e57" />

    <meta
      name="description"
      content="Little Lemon is a Mediterranean restaurant in Chicago. Explore our restaurant and reserve your table online."
    />

    <!-- Open Graph Metadata -->
    <meta
      property="og:title"
      content="Little Lemon | Mediterranean Restaurant"
    />

    <meta
      property="og:description"
      content="Fresh Mediterranean flavours, good company and a table waiting for you. Reserve your table at Little Lemon."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=85"
    />

    <meta property="og:image:alt" content="Fresh Mediterranean food" />

    <!-- Restaurant Favicon -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Markazi+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Little Lemon | Reserve Your Table</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to use the Little Lemon reservation
      application.
    </noscript>

    <div id="root"></div>
  </body>
</html>
